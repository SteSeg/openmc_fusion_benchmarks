name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONNOUSERSITE: "1"
      PIP_USER: "0"
    steps:
      - name: Apt dependencies
        shell: bash
        run: |
          sudo apt -y update
          sudo apt install -y libglu1-mesa \
                              libglu1-mesa-dev
        
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: test-env
          miniforge-version: latest
          channels: conda-forge
          auto-activate-base: false

      - name: Install OpenMC via Conda
        shell: bash -l {0}
        run: |
          conda run -n test-env mamba install -c conda-forge openmc>=0.14.0

      - name: Install pymoab and pydagmc
        shell: bash -l {0}
        run: |
          conda run -n test-env python -m pip install --no-user --extra-index-url https://shimwell.github.io/wheels moab
          conda run -n test-env python -m pip install --no-user git+https://github.com/svalinn/pydagmc
  
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda run -n test-env pip install --no-user coveralls
          conda run -n test-env python -m pip install --no-user .[tests]

      - name: Debug Python environment
        shell: bash -l {0}
        run: |
          conda run -n test-env python -c "import sys; print(sys.executable)"
          conda run -n test-env python -c "import site; print(site.getsitepackages())"

      - name: Run tests
        shell: bash -l {0}
        run: |
          conda run -n test-env python -m pytest test/ --cov openmc_fusion_benchmarks --cov-report xml --cov-report term

      - name: Upload coverage to Coveralls
        shell: bash -l {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conda run -n test-env coveralls || true