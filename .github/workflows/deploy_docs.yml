name: Deploy Documentation

on:
  push:
    branches:
      - main
      - to_ghpages  # adjust this to your doc branch
  pull_request:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for sphinx-multiversion to access git history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-book-theme myst-parser sphinx-multiversion sphinxcontrib-bibtex
          pip install .[docs]

      - name: Build documentation
        run: |
          python -m sphinx_multiversion docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html