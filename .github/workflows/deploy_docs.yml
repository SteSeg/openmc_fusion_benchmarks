name: Deploy Docs
on:
  push:
    branches:
      - to_ghpages  # or 'develop' or any branch you want to trigger deployment from

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"  # Change to your required version

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: test-env
          miniforge-version: latest
          # use-mamba: true
          channels: conda-forge

      - name: Create Conda environment
        shell: bash -l {0}
        run: |
          conda install -c conda-forge openmc>=0.14.0
  
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          python -m pip install .[tests]
          pip install sphinx sphinx-book-theme myst-parser myst-nb sphinx-multiversion | 
          sphinxcontrib-bibtex

      - name: Build documentation with sphinx-multiversion
        run: |
          sphinx-multiversion docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html