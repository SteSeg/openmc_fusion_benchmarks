openapi: 3.0.3
info:
  title: Fusion Neutronics Benchmark Specification
  version: 1.0.0
  description: >
    OpenAPI specification for a benchmark definition used in fusion neutronics transport validation.

components:
  schemas:
    Benchmark:
      type: object
      required:
        - metadata
        - materials
        - geometry
        - source
        # - irradiation_schedule
        - results
        # - uncertainty_quantification
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        geometry:
          $ref: '#/components/schemas/Geometry'
        source:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        irradiation_schedule:
          $ref: '#/components/schemas/IrradiationSchedule'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
        uncertainty_quantification:
          $ref: '#/components/schemas/UQ'

    Metadata:
      type: object
      required: [authors, date_created, location, references, version]
      properties:
        authors:
          type: array
          items: { type: object }
        date_created:
          type: string
          format: date
        location:
          type: string
        references:
          type: array
          items: { type: string }
        version:
          type: string

    Material:
      type: object
      required: [material_id, name, composition, density, temperature]
      properties:
        material_id:
          type: integer
        name:
          type: string
        composition:
          type: array
          properties:
            type:
              type: string
              enum: [mass, atomic]
            fractions:
              type: object
              additionalProperties:
                type: number
        density:
          type: number
        temperature:
          type: number

    Geometry:
      type: object
      properties:
        type:
          type: string
          enum: [cad, csg]
        cad_file:
          type: string
        surfaces:
          type: array
          items:
            $ref: '#/components/schemas/Surface'
        cells:
          type: array
          items:
            $ref: '#/components/schemas/Cell'

    Surface:
      type: object
      required: [id, type, parameters]
      properties:
        id:
          type: integer
        type:
          type: string
        parameters:
          type: number
          additionalProperties:
            type: number
        boundary_condition:
          type: string
          enum: [vacuum, reflective, periodic, white]

    CSGCell:
      type: object
      required: [id, region]
      properties:
        id:
          type: integer
        name:
          type: string
        region:
          type: string
        material_id:
          type: integer
        temperature:
          type: number

# SOURCE
# Future Extensions
# - Support for time dependence (e.g., pulsed fusion sources)
# - Correlated angle-energy distributions
# - Multiple sources in a list (for composite sources)
    Source:
      type: object
      required: [particle, geometry]
      properties:
        particle:
          type: string
        geometry:
          type: string
          enum: [point, line, box, sphere]
        cell:
          type: integer
        material:
          type: integer
        angle_energy_distribution:
          type: array
          items:
            type: object
            properties:
              angle_bin:
                type: array
                items: { type: number }
              energy_distribution:
                type: array
                items:
                  type: object
                  properties:
                    energy:
                      type: number
                    probability:
                      type: number

# IRRADIATION SCHEDULE
# Future-Proof Ideas
# - Add repeat: N to repeat a phase N times (e.g. pulsed operation)
# - Add time_profile: file.csv to support arbitrary time-dependent flux
# - Add cooling_only: true as a shortcut for pure decay phases
    IrradiationSchedule:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          items:
            type: object
            properties:
              power:
                type: number
              duration:
                type: number
              unit:
                type: string
                enum: [s, h, d]

# RESULTS
# domain.type can be cell, surface, mesh, volume_detector, etc.
# values can be:
# Inline scalars or vectors
# Referenced file (e.g., HDF5 mesh data)
# You can optionally include:
# validation_type: absolute | relative | spectral shape
# reference_result_id for comparing to other results
# location for point detectors
    Result:
      type: object
      required: [type, target, quantity]
      properties:
        type:
          type: string
          enum: [cell, surface, mesh, volume]
        target:
          type: string
        quantity:
          type: string
        energy_bins:
          type: array
          items:
            type: number

# UNCERTAINTY QUANTIFICATION
# Extensions To Add Later
# Perturbation correlation groups (e.g., tied isotopes or material sets)
# Experimental uncertainty models (e.g., detector efficiency)
# UQ-specific output storage (e.g., full distributions, quantiles, Sobol plots)
# Surrogate modeling or reduced-order model integration
    UQ:
      type: object
      properties:
        nuclear_data:
          type: boolean
        materials:
          type: object
          properties:
            density:
              type: boolean
            composition:
              type: boolean
        source:
          type: object
          properties:
            geometry:
              type: boolean
            angle:
              type: boolean
            energy:
              type: boolean