$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://openmc-fusion/schemas/benchmark_schema"

openapi: 3.0.3
info:
  title: Fusion Neutronics Benchmark Specification
  version: 1.0.0
  description: >
    OpenAPI specification for a benchmark definition used in fusion neutronics transport validation.

$ref: "#/components/schemas/Benchmark"
components:
  schemas:
    Benchmark:
      type: object
      required: 
        - metadata
        - materials
        - geometry
        - sources
        - tallies
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        geometry:
          $ref: '#/components/schemas/Geometry'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        tallies:
          type: array
          items:
            $ref: '#/components/schemas/Tally'

    Metadata:
      type: object
      required: [title, version, description, experiment_type, experiment_category, references]
      properties:
        title:
          type: string
        version:
          type: string
        description:
          type: string
        authors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              affiliation:
                type: string
              email:
                type: string
            required: [name, affiliation, email]
        experiment_date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"  # YYYY-MM-DD format
        date_created:
          type: string
          pattern: "^(N/A|\\d{4}-\\d{2}-\\d{2})$"  # Allows "N/A" or date format
        last_updated:
          type: string
          pattern: "^(N/A|\\d{4}-\\d{2}-\\d{2})$"  # Allows "N/A" or date format
        location:
          type: object
          properties:
            facility:
              type: string
            city:
              type: string
            country:
              type: string
          required: [facility, city, country]
        experiment_type:
          type: string
          enum: [fusion, fission, accelerator, other]
        experiment_category:
          type: string
          enum: [neutron, gamma, mixed]
        references:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              doi:
                type: string
                format: uri  # Ensures a valid URL format for DOI
            required: [title, doi]

    Material:
      type: object
      required: [id, name, composition, density]
      properties:
        id:
          type: integer
        name:
          type: string
        composition:
          type: object
          properties:
            composition_type:
              type: string
            fraction_type:
              type: string
              enum: [atomic, weight]
            data:
              type: object
              additionalProperties:
                type: number
          required: [composition_type, fraction_type, data]
        density:
          type: object
          properties:
            value:
              type: number
            units:
              type: string
              enum: [g/cm3]
          required: [value, units]

    Geometry:
      type: object
      properties:
        type:
          type: string
          enum: [cad, csg]
        cad_file:
          type: string
        surfaces:
          type: array
          items:
            $ref: '#/components/schemas/Surface'
        cells:
          type: array
          items:
            $ref: '#/components/schemas/Cell'
    
    Source:
      type: object
      required: [particle_type, spatial_distribution, angular_energy_distribution, strength]
      properties:
        particle_type:
          type: string
          enum: [neutron, photon]
        strength:
          type: number
        spatial_distribution:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [point, box, cylinder, sphere, cartesian, mesh, domain]
            location:
        angular_energy_distribution:
          type: object
          required: [dims, angle, energy, weights]
          properties:
          interpolation: str
          # required: [type]
          properties:
            type:
              type: string
              enum: [isotropic, tabulated]
            reference_uvw:
              type: array
              items:
                type: number
              minItems: 3
              maxItems: 3
              description: A 3D direction or position vector [x, y, z]
            bins:
              type: array
              items:
                type: object
                required: [angle_range, energy_distribution]
                properties:
                  angle_range:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
                  energy_distribution:
                    type: object
                    required: [type, bins, weights, strength]
                    properties:
                      type:
                        type: string
                        enum: [tabular]
                      interpolation:
                        type: string
                        enum: [histogram, linear-linear, linear-logarithmic, logarithmic-linear, logarithmic-logarithmic]
                      bins: 
                        type: object
                        required: [values, units]
                        properties:
                          values:
                            type: array
                            items:
                              type: number
                          units:
                            type: string
                            enum: [eV, keV, MeV, GeV]
                      probabilities:
                        type: object
                        required: [values]
                        properties:
                          values:
                            type: array
                            items:
                              type: number
                      strength:
                        type: number
      rate:
        type: object
        required: [value, units]
        properties:
          value:
            type: number
          units:
            type: string
            enum: [n/s, particles/s]


    # IrradiationSchedule:
    #   type: object
    #   required: [steps]
    #   properties:
    #     steps:
    #       type: array
    #       items:
    #         type: object
    #         properties:
    #           power:
    #             type: number
    #           duration:
    #             type: number
    #           unit:
    #             type: string
    #             enum: [s, h, d]

    Tally:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        particle:
          type: string
          enum: [neutron, photon]  # Enforcing valid particle types
        quantity:
          type: string
        domain:
          type: object
          properties:
            type:
              type: string
              enum: [surface, volume]  # Adjust if needed
            id:
              type: integer
          required: [type, id]
        values:
          type: array
          items:
            type: object
            properties:
              value:
                type: array
                items:
                  type: number
              units:
                type: string
            required: [value, units]
      required: [name, description, particle, quantity, domain, values]


