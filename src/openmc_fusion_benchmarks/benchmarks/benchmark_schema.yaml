$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://openmc-fusion/schemas/benchmark_schema"

openapi: 3.0.3
info:
  title: Fusion Neutronics Benchmark Specification
  version: 1.0.0
  description: >
    OpenAPI specification for a benchmark definition used in fusion neutronics transport validation.

$ref: "#/components/schemas/Benchmark"
components:
  schemas:
    Benchmark:
      type: object
      required: 
        - metadata
        - materials
        - geometry
        - sources
        - settings
        - tallies
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
        geometry:
          $ref: '#/components/schemas/Geometry'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        settings:
          $ref: '#/components/schemas/Settings'
        tallies:
          type: array
          items:
            $ref: '#/components/schemas/Tally'
        # Optional entries
        irradiation_schedule:
          $ref: '#/components/schemas/IrradiationSchedule'
        uncertainty_quantification:
          type: array
          items:
            $ref: '#/components/schemas/UncertaintyQuantification'

    Metadata:
      type: object
      required: [title, type, category, version, description, date, location, references]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [experimental, computational, analytic]
        category:
          type: string
          enum: [fusion, fission, accelerator, other]
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"  # Major.Minor.Patch format
        description:
          type: string
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"  # YYYY-MM-DD format
        location:
          type: object
          properties:
            facility:
              type: string
            city:
              type: string
            country:
              type: string
          required: [facility, city, country]
        references:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              doi:
                type: string
                format: uri  # Ensures a valid URL format for DOI
            required: [title]
            anyOf:
            - required: [doi]
            - required: [url]
        authors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              affiliation:
                type: string
              email:
                type: string
            required: [name, affiliation, email]

    Material:
      type: object
      required: [id, name, composition, density]
      properties:
        id:
          type: integer
        name:
          type: string
        composition:
          type: object
          properties:
            composition_type:
              type: string
            fraction_type:
              type: string
              enum: [atomic, weight]
            data:
              type: object
              additionalProperties:
                type: number
          required: [composition_type, fraction_type, data]
        density:
          type: object
          properties:
            value:
              type: number
            units:
              type: string
              enum: [g/cm3]
          required: [value, units]

    Geometry:
      type: object
      required: [cad_file, meshing]
      properties:
        cad_file:
          type: string
        meshing:
          type: object
          required: [global_mesh_size_min, global_mesh_size_max, volumes]
          properties:
            global_mesh_size_min:
              type: number
            global_mesh_size_max:
              type: number
            volumes:
              type: array
              items:
                type: object
                required: [id, material]
                properties:
                  id:
                    type: integer
                  material:
                    type: string
                  mesh_size:
                    type: number

    
    Source:
      type: object
      required: [particle, spatial_distribution, angular_energy_distribution]
      properties:
        particle:
          type: string
          enum: [neutron, photon]
        strength:
          type: number
        rate:
          type: object
          required: [value, units]
          properties:
            value:
              type: number
            units:
              type: string
              enum: [n/s, particles/s]
        spatial_distribution:
          oneOf:
            - type: object
              required: [type, center]
              properties:
                type:
                  const: point
                center:
                  type: array
                  items:
                    type: number
                  minItems: 3
                  maxItems: 3
            - type: object
              required: [type]
              properties:
                type:
                  enum: [box, cylinder, sphere, cartesian, mesh, domain]
        angular_energy_distribution:
          oneOf:
            - $ref: '#/components/schemas/LegacyAngularEnergyDistribution'
            - $ref: '#/components/schemas/PolarAzimuthalWithSpectraDistribution'

    LegacyAngularEnergyDistribution:
      type: object
      required: [angle, energy, weights, strength, polar_direction]
      properties:
        polar_direction:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
        dims:
          type: array
          items:
            type: string
        angle:
          type: object
          required: [bins, units]
          properties:
            bins:
              type: array
              items:
                type: number
              minItems: 2
            units:
              type: string
              enum: [degrees, radians]
        energy:
          type: object
          required: [values, units, interpolation]
          properties:
            values:
              type: array
              items:
                type: number
              minItems: 1
            units:
              type: string
              enum: [eV, keV, MeV, GeV]
            interpolation:
              type: string
              enum: [histogram, linear-linear, linear-logarithmic, logarithmic-linear, logarithmic-logarithmic]
        weights:
          type: array
          items:
            type: array
            items:
              type: number
        strength:
          type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                type: number

    PolarAzimuthalWithSpectraDistribution:
      type: object
      required: [model, angular, energy]
      properties:
        model:
          const: polar_azimuthal_with_spectra
        angular:
          type: object
          required: [units, reference_uvw, bins]
          properties:
            units:
              type: string
              enum: [degrees, radians]
            reference_uvw:
              type: array
              items:
                type: number
              minItems: 3
              maxItems: 3
            bins:
              type: array
              minItems: 1
              items:
                type: object
                required: [polar, azimuth]
                properties:
                  polar:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
                  azimuth:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
                  strength:
                    type: number
        energy:
          type: object
          required: [units, interpolation, spectra]
          properties:
            units:
              type: string
              enum: [eV, keV, MeV, GeV]
            interpolation:
              type: string
              enum: [histogram, linear-linear, linear-logarithmic, logarithmic-linear, logarithmic-logarithmic]
            spectra:
              type: array
              minItems: 1
              items:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    minItems: 1
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items:
                        type: number

    Settings:
      type: object
      required: [run_mode, batches, particles_per_batch, photon_transport]
      properties:
        run_mode:
          type: string
          enum: [fixed_source, k_eigenvalue]
        batches:
          type: integer
        particles_per_batch:
          type: integer
        photon_transport:
          type: boolean
        # Optional entries

    Tally:
      type: object
      required: [name, particle, filters, scores]
      properties:
        name: 
          type: string
        description: 
          type: string
        particle:
          type: string
          enum: [neutron, photon, electron, positron]
        filters:
          type: array
          items:
            type: object
            required: [type, values]
            properties:
              type:
                type: string
                enum: [surface, cell, material, energy, mesh]
              values:
                type: array
              units:
                type: string
        scores:
          type: array
          items:
            type: string

    IrradiationSchedule:
      type: object
      # required: [steps]
      properties:
        steps:
          # type: array
          # items:
          #   type: object
          #   properties:
          #     power:
          #       type: number
          #     duration:
          #       type: number
          #     unit:
          #       type: string
          #       enum: [s, h, d]


    UncertaintyQuantification:
      type: object
      properties:
        realizations:
          type: array
          items:
            type: integer
      required: [realizations]
      allOf:
        - oneOf:
          - type: object
            properties:
              type:
                type: string
                const: nuclear_data
              nuclides:
                type: array
                items:
                  type: array
                  items:
                    type: string
              reactions:
                type: array
                items:
                  type: string
            required: [type, nuclides, reactions]

          # - type: object
          #   properties:
          #     type:
          #       type: string
          #       const: material
          #     materials:
          #       type: array
          #       items:
          #         type: string
          #   required: [type, materials]