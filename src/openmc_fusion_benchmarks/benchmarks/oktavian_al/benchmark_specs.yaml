metadata:
  title: Benchmark for Water Box in Fusion Neutron Field
  version: 1.0
  authors:
    - name: Alice Neutron
      affiliation: ITER Organization
      email: alice@iter.org
    - name: Bob Tokamak
      affiliation: CEA Cadarache
  date_created: 2023-11-01
  last_updated: 2025-03-26
  location:
    facility: FNG (Frascati Neutron Generator)
    institution: ENEA Frascati
    country: Italy
  references:
    - title: "Fusion Neutron Benchmarking at FNG"
      doi: ""
    - title: "Experimental Validation of Water Shielding in Fusion Neutron Fields"
      url: ""

materials:
  - material_id: 1
    name: Stainless Steel 316L
    composition:
      type: element  # or "nuclide"
      fraction_type: mass  # or "atomic"
      data:
        Fe: 0.65
        Cr: 0.17
        Ni: 0.12
        Mn: 0.02
        Si: 0.01
        C: 0.001
    density:
      value: 7.87
      units: g/cm3
    temperature:
      value: 600
      units: K

  - material_id: 2
    name: Borated Polyethylene
    composition:
      type: nuclide
      fraction_type: atomic
      data:
        H1: 0.667
        C12: 0.333
        B10: 0.05
    density:
      value: 1.1
      units: g/cm3
    temperature:
      value: 300
      units: K

geometry:
  geometry_type: CSG  # or "CAD"
  units: cm

  # Optional: if geometry_type is CAD
  cad:
    cad_file: geometry.stp
    dagmc: true
    material_assignments:
      - volume_id: 1
        material_id: 1
      - volume_id: 2
        material_id: 2

  # Optional: if geometry_type is CSG
  csg:
    surfaces:
      - id: 1
        type: x-plane
        location: -10.0
        boundary: reflective

      - id: 2
        type: x-plane
        location: 10.0
        boundary: vacuum

      - id: 3
        type: y-plane
        location: -10.0
        boundary: reflective

      - id: 4
        type: y-plane
        location: 10.0
        boundary: reflective

      - id: 5
        type: z-plane
        location: -10.0
        boundary: reflective

      - id: 6
        type: z-plane
        location: 10.0
        boundary: reflective

    cells:
      - id: 1
        name: water_box
        material_id: 2
        region: "+1 -2 +3 -4 +5 -6"

# SOURCE
# Future Extensions
# - Support for time dependence (e.g., pulsed fusion sources)
# - Correlated angle-energy distributions
# - Multiple sources in a list (for composite sources)
source:
  particle_type: neutron  # or "photon", "deuteron", etc.
  geometry:
    type: point  # or "line", "surface", "volume"
    location: [0.0, 0.0, 0.0]  # for point
    # For volume/line sources:
    # bounds: [[x0, y0, z0], [x1, y1, z1]]

  association:
    type: cell  # or "material"
    id: 1       # cell_id or material_id (optional)

  energy_distribution:
    type: tabular  # or "monoenergetic", "maxwellian", "watt", "fission_spectrum"
    bins: [1e5, 1e6, 1e7, 1.5e7] # eV
    probabilities: [0.2, 0.5, 0.3]

  angular_distribution:
    type: tabular  # or "isotropic", "monodirectional", "focused"
    bins: [-1.0, -0.5, 0.0, 0.5, 1.0]  # cos(theta)
    probabilities: [0.1, 0.2, 0.4, 0.2, 0.1]

  rate:
    value: 1.0e14
    units: n/s

# IRRADIATION SCHEDULE
# Future-Proof Ideas
# - Add repeat: N to repeat a phase N times (e.g. pulsed operation)
# - Add time_profile: file.csv to support arbitrary time-dependent flux
# - Add cooling_only: true as a shortcut for pure decay phases
irradiation_schedule:
  time_units: s  # or "d", "h", "y"

  phases:
    - name: Initial Pulse
      duration: 3600           # 1 hour
      flux:
        value: 1.0e14
        units: n/cm2/s
      power:                   # Optional, for fission benchmarks or scaling
        value: 50
        units: MW
      comment: "Startup test pulse"

    - name: Rest Period
      duration: 86400          # 1 day
      flux:
        value: 0.0
        units: n/cm2/s
      comment: "Cooling time between pulses"

    - name: Steady-State Operation
      duration: 2592000        # 30 days
      flux:
        value: 5.0e13
        units: n/cm2/s
      comment: "Typical DEMO blanket loading"

    - name: Final Cooldown
      duration: 1.577e7        # ~6 months
      flux:
        value: 0.0
        units: n/cm2/s
      comment: "Decay period for activation measurements"

# RESULTS
# domain.type can be cell, surface, mesh, volume_detector, etc.
# values can be:
# Inline scalars or vectors
# Referenced file (e.g., HDF5 mesh data)
# You can optionally include:
# validation_type: absolute | relative | spectral shape
# reference_result_id for comparing to other results
# location for point detectors
results:
  - id: flux_cell_1
    description: "Neutron flux spectrum in central cell"
    quantity: flux
    domain:
      type: cell
      id: 1
    energy_bins:
      units: eV
      edges: [1e-5, 1e-3, 1.0, 1e2, 1e4, 1e6, 1e7]
    values:
      - value: [1.2e12, 2.3e12, 1.1e13, 3.3e12, 8.9e11, 4.4e11]
        units: n/cm2/s
        source: "experimental"
        uncertainty: [0.05, 0.04, 0.03, 0.04, 0.07, 0.1]

  - id: leakage_surface
    description: "Total neutron current leaving the outer surface"
    quantity: current
    domain:
      type: surface
      id: 10
    values:
      - value: 2.3e12
        units: n/s
        source: "simulation"
        uncertainty: 0.03

  - id: dose_in_mesh
    description: "Total dose equivalent in mesh voxels"
    quantity: dose
    domain:
      type: mesh
      mesh_id: 1
    values:
      - format: file
        path: results/dose_mesh_1.h5
        dataset: /dose
        units: mrem
        source: simulation

# UNCERTAINTY QUANTIFICATION
# Extensions To Add Later
# Perturbation correlation groups (e.g., tied isotopes or material sets)
# Experimental uncertainty models (e.g., detector efficiency)
# UQ-specific output storage (e.g., full distributions, quantiles, Sobol plots)
# Surrogate modeling or reduced-order model integration
uncertainty_quantification:
  methods:
    - type: stochastic_sampling
      samples: 1000
      seed: 42
      comment: "Monte Carlo sampling of nuclear and source parameters"

  perturbations:

    - type: nuclear_data
      reactions: [n,gamma, n,2n]
      isotopes: [Fe56, Cr52]
      source: TENDL-2023
      covariance:
        format: ENDF
        path: data/fe56_cov.endf

    - type: material
      material_id: 1
      parameters:
        - name: density
          distribution: normal
          mean: 7.87
          stddev: 0.05
        - name: composition.Cr
          distribution: uniform
          min: 0.16
          max: 0.18

    - type: source_geometry
      parameter: location
      distribution: multivariate_normal
      mean: [0.0, 0.0, 0.0]
      covariance: [[0.01, 0.0, 0.0], [0.0, 0.01, 0.0], [0.0, 0.0, 0.01]]

    - type: source_energy_distribution
      distribution_type: tabular
      perturbation_mode: sample_bins
      method: Dirichlet
      alpha: [1, 1, 1, 1]
      comment: "Randomizing normalized spectrum bins"

    - type: source_angular_distribution
      distribution_type: tabular
      perturbation_mode: eigenmode
      covariance_matrix: data/angdist_cov.npy
      method: KL_modes
      modes: 5

  outputs_of_interest:
    - result_id: flux_cell_1
    - result_id: dose_in_mesh
    - result_id: leakage_surface

  metrics:
    - type: standard_deviation
    - type: 95_percent_confidence_interval
    - type: Sobol_indices