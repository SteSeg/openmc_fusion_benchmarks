# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    nodejs: "20"
  commands:
    - pip install -r requirements.txt
    - jupyter-book build docs/source
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - if [ -d "docs/source/_build/html" ]; then cp -r docs/source/_build/html/* $READTHEDOCS_OUTPUT/html/; elif [ -d "docs/source/_build" ]; then cp -r docs/source/_build/* $READTHEDOCS_OUTPUT/html/; else find docs/source -name "_build" -o -name "build"; fi
        
# Build documentation with Jupyter Book
# Output will be in docs/source/_build/html
