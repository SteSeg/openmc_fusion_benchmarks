# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    nodejs: "20"
  commands:
    - pip install -r requirements.txt
    - jupyter-book build docs/source
    - echo "=== Checking for output directories ==="
    - ls -la docs/source/
    - find docs -type f -name "*.html" | head -10
    - find . -type d -name "_site" -o -name "_build" -o -name "build"
        
# Build documentation with Jupyter Book
# Output will be in docs/source/_build/html
